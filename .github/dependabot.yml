version: 2
updates:
  - package-ecosystem: npm
    directory: /gateway-workers
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /worker # the Rust Worker's test harness and wrangler (pinned exactly; test/deploy tooling only)
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-worker-harness:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: / # the Cargo workspace: core + gateway-rust + worker + ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "axum"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "base64"
        update-types: ["version-update:semver-major"]
      - dependency-name: "k256"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "p256"
        update-types: ["version-update:semver-minor"]
      # workers-rs, wasm-bindgen and worker-build are one pinned set (the wasm-bindgen CLI that worker-build
      # fetches must equal the crate): bumped together by hand, see worker/README.md "Toolchain".
      - dependency-name: "worker"
      - dependency-name: "worker-*"
      - dependency-name: "wasm-bindgen"
      - dependency-name: "wasm-bindgen-*"
      - dependency-name: "js-sys"
      - dependency-name: "web-sys"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /gateway-rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
