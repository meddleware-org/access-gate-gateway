name: Deploy Workers

# Deploys the LIVE NFT-gated relay Worker (`access-gate-gateway`). Manual only: a deploy can require a
# coordinated secret change (see the walrus runbook), so it never runs on push. The job re-runs the
# full CI first and executes in the protected `production` environment (configure required
# reviewers in the repository settings).
#
# Worker secrets live in Cloudflare and persist across deploys. One of them can also be supplied
# from GitHub:
#   - GitHub secret `UPSTREAM_AUTH_HEADERS` set: it is checked (scripts/check-upstream-auth.mjs; with
#     the repo variable `UPSTREAM_CHECK_URL` set, the origin must accept it), then the new code and that secret
#     go live together (versions upload → versions secret put → versions deploy), so a format or
#     credential change never runs against the wrong code. While it is set, GitHub is the source of
#     truth: every deploy re-applies it, so rotate it here (a value changed only in Cloudflare is
#     overwritten on the next deploy).
#   - Not set: `wrangler deploy`, keeping the secrets already stored in Cloudflare.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/node-ci.yml

  deploy:
    name: Wrangler deploy (gateway-workers)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: gateway-workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Check UPSTREAM_AUTH_HEADERS (when supplied from GitHub)
        env:
          UPSTREAM_AUTH_HEADERS: ${{ secrets.UPSTREAM_AUTH_HEADERS }}
          UPSTREAM_CHECK_URL: ${{ vars.UPSTREAM_CHECK_URL }}
        # The Worker's own parser plus non-revealing shape diagnostics; with UPSTREAM_CHECK_URL set,
        # the headers must also get a 2xx from the origin. A bad value stops here, before any upload.
        run: |
          if [ -z "${UPSTREAM_AUTH_HEADERS}" ]; then
            echo "UPSTREAM_AUTH_HEADERS not set in GitHub: the Worker keeps the value stored in Cloudflare."
            exit 0
          fi
          node scripts/check-upstream-auth.mjs

      # A Worker secret and a [vars] entry may not share a name. When a value moves from a secret to
      # wrangler.toml [vars], list it here: its secret is deleted from a new, NOT-yet-deployed version,
      # which the upload below then builds on, so the live version keeps serving until the final
      # deploy. A name that is no longer a secret is reported and skipped. If the delete fails for any
      # other reason the upload fails on the name clash and nothing is deployed.
      - name: Retire secrets that became plain vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RETIRED_SECRETS: NFT_TYPE
        run: |
          for name in ${RETIRED_SECRETS}; do
            if printf 'y\n' | npx wrangler versions secret delete "${name}" --message "retire ${name} (now a var)"; then
              echo "Deleted secret ${name} from a pending version."
            else
              echo "Secret ${name} not present (already retired) — skipping."
            fi
          done

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          UPSTREAM_AUTH_HEADERS: ${{ secrets.UPSTREAM_AUTH_HEADERS }}
          TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "${UPSTREAM_AUTH_HEADERS}" ]; then
            npm run deploy
            exit 0
          fi
          # Code and secret switch together: upload a version (no traffic), add the secret to it as a
          # tagged version, then send all traffic to that version.
          npx wrangler versions upload --message "${GITHUB_SHA}" --tag "${TAG}-code"
          printf '%s' "${UPSTREAM_AUTH_HEADERS}" | npx wrangler versions secret put UPSTREAM_AUTH_HEADERS --message "${GITHUB_SHA} + UPSTREAM_AUTH_HEADERS" --tag "${TAG}"
          npx wrangler versions deploy --version-tag "${TAG}@100" --message "${GITHUB_SHA}" --yes
