name: Publish (Docker)
on:
  push:
    tags:
      - "v*"

env:
  IMAGE: nft-gate-gateway

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/rust-ci.yml

  # ── Rust gateway: Docker image — split into per-arch native builds + merge ──
  # Using native ubuntu-24.04-arm runners instead of QEMU emulation eliminates
  # the 10-20x slowdown of arm64 Rust compilation under QEMU. Each leg builds
  # only its native platform and pushes an intermediate :<sha>-<arch> tag; the
  # merge job creates the final semver-tagged multi-arch index.

  build-docker-amd64-public:
    name: Docker amd64 (quay.io + Docker Hub)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gateway-rust
          platforms: linux/amd64
          push: true
          tags: |
            quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}-amd64
            docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}-amd64
          cache-from: type=gha,scope=amd64-public
          cache-to: type=gha,scope=amd64-public,mode=max

  build-docker-arm64-public:
    name: Docker arm64 (quay.io + Docker Hub)
    runs-on: ubuntu-24.04-arm
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gateway-rust
          platforms: linux/arm64
          push: true
          tags: |
            quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}-arm64
            docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}-arm64
          cache-from: type=gha,scope=arm64-public
          cache-to: type=gha,scope=arm64-public,mode=max

  merge-docker-public:
    name: Merge + sign (quay.io + Docker Hub)
    needs: [build-docker-amd64-public, build-docker-arm64-public]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute final tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Merge multi-arch manifests
        id: merge
        env:
          QUAY_NS: ${{ vars.QUAY_NAMESPACE }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
          SHA: ${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          QUAY_SRC="quay.io/${QUAY_NS}/${IMAGE}:${SHA}"
          HUB_SRC="docker.io/${DOCKERHUB_NS}/${IMAGE}:${SHA}"

          # Build --tag flags from metadata output
          QUAY_FLAGS=()
          HUB_FLAGS=()
          while IFS= read -r tag; do
            if [[ "$tag" == quay.io/* ]]; then
              QUAY_FLAGS+=(--tag "$tag")
            elif [[ "$tag" == docker.io/* ]]; then
              HUB_FLAGS+=(--tag "$tag")
            fi
          done <<< "${TAGS}"

          docker buildx imagetools create "${QUAY_FLAGS[@]}" "${QUAY_SRC}-amd64" "${QUAY_SRC}-arm64"
          docker buildx imagetools create "${HUB_FLAGS[@]}"   "${HUB_SRC}-amd64"  "${HUB_SRC}-arm64"

          # Resolve the merged manifest digest from the primary semver tag
          PRIMARY=$(echo "${TAGS}" | grep 'quay.io' | grep -v 'latest' | head -1)
          DIGEST=$(docker buildx imagetools inspect "${PRIMARY}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Scan the merged image by digest BEFORE anything is signed or attested: a failing scan means
      # no signature, so consumers verifying signatures never accept a vulnerable image. HIGH and
      # CRITICAL findings with a fix fail the job; the image tags are already pushed, so a failure
      # needs a fixed rebuild (a new tag), not a re-run.
      - name: Scan the published image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          version: v0.74.0
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.QUAY_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          cosign sign --yes "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      # SBOM of the published image, attached as a signed cosign attestation (SPDX JSON).
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      - name: Attest build provenance (quay.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: echo "Published & signed @ ${{ steps.merge.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Self-hosted registry: promote the published image by digest (no rebuild) ──
  # quay.io, Docker Hub and the self-hosted registry must return the SAME digest for
  # <image>:<tag> (workspace docs/images/IMAGES.md, "Consensus"), so this job copies the image
  # that merge-docker-public pushed and signed instead of building it again. Best-effort: it fails
  # harmlessly until the PRIVATE_REGISTRY_* credentials exist.
  mirror-private:
    name: Mirror (self-hosted registry)
    runs-on: ubuntu-latest
    needs: [merge-docker-public]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.4

      - name: Log in to self-hosted registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.PRIVATE_REGISTRY }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.PRIVATE_REGISTRY }}/${{ vars.PRIVATE_NAMESPACE }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Copy the published image (same digest) and verify
        env:
          DIGEST: ${{ needs.merge-docker-public.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY }}
          PRIVATE_NAMESPACE: ${{ vars.PRIVATE_NAMESPACE }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the public job exported no valid image digest (got '${DIGEST}')"
            exit 1
          fi
          SRC="quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          COUNT=0
          while IFS= read -r dest; do
            [[ -n "${dest}" ]] || continue
            COUNT=$((COUNT + 1))
            # The published manifest is copied byte-for-byte, so the digest is unchanged;
            # `cosign copy` also carries the tag-based cosign artifacts (.sig/.att/.sbom).
            cosign copy --force "${SRC}" "${dest}"
            # cosign v3 stores signatures, SBOM attestations and build provenance as OCI
            # referrers, which `cosign copy` does not transfer: copy the referrers too.
            oras cp --recursive "${SRC}" "${dest}"
            GOT="$(docker buildx imagetools inspect "${dest}" --format '{{.Manifest.Digest}}')"
            if [[ "${GOT}" != "${DIGEST}" ]]; then
              echo "::error::${dest} resolves to ${GOT}, not the published ${DIGEST}"
              exit 1
            fi
            echo "${dest} -> ${GOT}"
          done <<< "${TAGS}"
          if (( COUNT == 0 )); then
            echo "::error::no tags to mirror (not a release tag?)"
            exit 1
          fi
          # The signature must verify on the mirror exactly as it does on quay.io.
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/docker-publish\.yml@refs/tags/v" \
            "${PRIVATE_REGISTRY}/${PRIVATE_NAMESPACE}/${IMAGE}@${DIGEST}" > /dev/null

      - name: Summary
        if: always()
        env:
          DIGEST: ${{ needs.merge-docker-public.outputs.digest }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY }}
        run: |
          echo "Mirrored (no rebuild) @ digest ${DIGEST} to private registry @ ${PRIVATE_REGISTRY}" >> "$GITHUB_STEP_SUMMARY"
