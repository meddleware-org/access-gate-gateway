name: Rust CI

# CI for the Rust workspace: access-gate-gateway-core (the shared decision logic, native and wasm32), the
# gateway-rust adapter, the Rust Cloudflare Worker (`worker` job: wasm build, size gate, workerd suites,
# differential run against the TypeScript Worker), the CI helper binary, and the gateway-rust Dockerfile scan.
# The TypeScript Workers gateway (retiring) is covered by node-ci.yml.

on:
  push:
    branches: ["main"]
  pull_request:
  # Reusable: the release and deploy workflows run this whole file as their verification step.
  workflow_call:

# Privacy by default: no tool in this workflow reports usage to its vendor (Wrangler metrics, the DO_NOT_TRACK convention).
env:
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"

permissions:
  # The token can only read the repository: CI never writes to it.
  contents: read

jobs:
  # Job 1: the native workspace: format, lint, tests, a Redis round trip, coverage and the dependency policy.
  rust-ci:
    name: Rust workspace (core + gateway-rust + worker + ci)
    runs-on: ubuntu-latest
    # A real Redis for the env-gated backend round trip (Lua lease/commit/release, GETDEL).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      # Check out the commit this run was triggered for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions aligned (npm == crate == tag)
        run: bash scripts/check-versions.sh

      # rustup ships on the runner image; using it directly leaves no third-party toolchain action
      # (which publishes no releases, only a moving branch) to pin.
      - name: Install the stable toolchain
        # Install the components the steps below need (formatter, linter, coverage tooling) and make stable the default.
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools --no-self-update && rustup default stable

      # Cache the Cargo build output between runs; only pushes to main write it, so pull requests cannot fill the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          # Only save the cache on main-branch pushes to avoid saturating the
          # GitHub Actions cache upload bandwidth on every PR run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Formatting is checked, not applied: a diff here means the author forgot `cargo fmt`.
      - name: Format check
        run: cargo fmt --check

      # Every lint is an error (`-D warnings`), across every target including tests, with the lock file honoured.
      - name: Clippy
        run: cargo clippy --all-targets --locked --workspace -- -D warnings

      - name: Test
        # Every test in the workspace, with exactly the dependency versions in Cargo.lock.
        run: cargo test --locked --workspace

      - name: Redis backend round trip
        env:
          REDIS_URL: redis://127.0.0.1:6379
        # The Redis-backed tests are ignored by default; run them here against the service container above.
        run: cargo test --locked -p access-gate-gateway -- --ignored redis_backend

      # Coverage figure (RUST lens): printed to the job summary; informational, not a gate.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Coverage
        run: |
          cargo llvm-cov --locked --workspace --summary-only | tee coverage.txt
          { echo '### Line coverage (workspace)'; echo '```'; tail -n 3 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Advisories, licences, bans and sources per deny.toml (workspace root; the graph includes the
      # wasm32 target of the core). The `advisories` check reads the same RustSec database as
      # `cargo audit`, so it supersedes the audit-only check (no second tool).
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Cargo.toml
      # core/fuzz is its own Cargo workspace (nightly-only fuzz targets), so the step above never sees its dependencies:
      # check them with their own policy (core/fuzz/deny.toml).
      - name: cargo deny (core/fuzz)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: core/fuzz/Cargo.toml
          arguments: --config core/fuzz/deny.toml
      # The release binary is built inside the Dockerfile (with --locked).

  # The decision logic runs in two places: natively (gateway-rust) and as wasm32 in the Cloudflare
  # Worker. This job pins the core ALONE (no hyper, no tokio; its own minimal feature set, which the
  # workspace test above unifies away) and proves it still builds for the Worker's target.
  core:
    name: access-gate-gateway-core (native tests + wasm32 build)
    runs-on: ubuntu-latest
    steps:
      # Check out the commit this run was triggered for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the stable toolchain with the wasm32 target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update && rustup default stable
      # Cache the Cargo build output between runs; only pushes to main write it, so pull requests cannot fill the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `-p` builds only the core, so a dependency another crate enables cannot hide a missing feature.
      - name: Test (native, core alone)
        run: cargo test --locked -p access-gate-gateway-core
      # The Worker runs as wasm32: a native-only dependency in the core would fail here.
      - name: Build for the Worker target
        run: cargo build --locked -p access-gate-gateway-core --target wasm32-unknown-unknown

  # The Rust Worker (workers-rs, wasm32). Everything it needs that is downloaded at build time is pinned
  # and checksummed (worker/scripts/fetch-build-tools.sh); worker-build and the wasm-bindgen crate are
  # pinned to matching versions in worker/Cargo.toml. The suites run the BUILT wasm under workerd.
  worker:
    name: Rust Worker (build, size gate, workerd suites, differential)
    runs-on: ubuntu-latest
    steps:
      # Check out the commit this run was triggered for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain with the wasm32 target
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown --no-self-update && rustup default stable

      # Cache the Cargo build output between runs; only pushes to main write it, so pull requests cannot fill the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: worker
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The request path may not panic: clippy denies unwrap/expect/panic/indexing (worker/Cargo.toml
      # [lints.clippy]); the canary proves the lints are live; checked natively AND for the Worker target,
      # with and without the test-only feature.
      - name: Clippy (native and wasm32, with and without test-hooks)
        run: |
          cargo clippy --locked -p access-gate-gateway-worker --all-targets -- -D warnings
          cargo clippy --locked -p access-gate-gateway-worker --all-targets --features test-hooks -- -D warnings
          cargo clippy --locked -p access-gate-gateway-worker --lib --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --locked -p access-gate-gateway-worker --lib --target wasm32-unknown-unknown --features test-hooks -- -D warnings

      # A throw-away file that breaks every panic lint must make clippy fail: this catches a lint that was quietly weakened.
      - name: Lint canary (the panic lints are enforced)
        run: bash worker/scripts/lint-canary.sh

      # The Worker's native tests and the CI helper's tests.
      - name: Native unit tests (Worker glue, CI helper)
        run: cargo test --locked -p access-gate-gateway-worker -p access-gate-gateway-ci

      # `worker-build` assembles the wasm bundle; its version must match the wasm-bindgen crate, so it is pinned.
      - name: Install worker-build (pinned)
        run: command -v worker-build >/dev/null && worker-build --version | grep -q '0.8.7' || cargo install worker-build --version 0.8.7 --locked

      - name: Fetch the pinned build tools (wasm-bindgen, wasm-opt, esbuild; SHA-256 verified)
        run: bash worker/scripts/fetch-build-tools.sh

      # Node for the harness (the Worker's tests and wrangler).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # The black-box suites are Node scripts (wrangler and the Sui SDK for signing proofs).
      - name: Install the harness dependencies
        working-directory: worker
        run: npm ci

      # Two builds: the one that ships, and one with the test-only routes the suites need.
      - name: Build (deployed variant and test-hooks variant)
        run: bash worker/scripts/build.sh all

      # The deployed bundle must not contain the test-hooks feature (audit F59); the self-test proves the guard
      # fails on the hooks variant.
      - name: Production bundle has no test-hooks code
        working-directory: worker
        run: |
          bash scripts/assert-prod-build.sh build
          bash scripts/assert-prod-build.sh --self-test build-hooks

      # The compressed bundle must stay within the platform's size limit with room to spare (1536 KiB here).
      - name: Size gate (wrangler deploy --dry-run, gzip total <= 1.5 MiB)
        working-directory: worker
        run: bash scripts/size-gate.sh 1536

      # The black-box suites run the built wasm under workerd, the runtime the platform uses.
      - name: workerd suites (router, proxy, redemption, state, quota, conformance, config, stream, panic)
        working-directory: worker
        timeout-minutes: 20
        run: npm test

      # The reference Worker needs its own dependencies; the same scenarios run against both.
      - name: Install the TypeScript Worker's dependencies (differential reference)
        working-directory: gateway-workers
        run: npm ci

      - name: Differential run (TypeScript Worker vs Rust Worker)
        working-directory: worker
        timeout-minutes: 15
        run: npm run test:diff

  # Job 4: the oldest Rust the native crates declare they support.
  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      # Check out the commit this run was triggered for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the declared minimum toolchain
        run: rustup toolchain install 1.88 --profile minimal --no-self-update && rustup default 1.88
      - name: Check on the declared minimum toolchain
        run: cargo check --locked -p access-gate-gateway-core -p access-gate-gateway

  # Job 5: scan the Dockerfile for misconfiguration and committed secrets.
  trivy-scan:
    name: Trivy (gateway-rust Dockerfile)
    runs-on: ubuntu-latest
    steps:
      # Check out the commit this run was triggered for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: gateway-rust
          version: v0.74.0
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # cargo-about fails the stage when a linked crate's licence is not accepted by gateway-rust/about.toml.
  # The same stage produces the file the image ships as /app/THIRD_PARTY_LICENSES.txt (F29).
  notices:
    name: Third-party licence notices (gateway-rust image stage)
    runs-on: ubuntu-latest
    steps:
      # Check out the commit this run was triggered for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build only the stage of the Dockerfile that collects the notices.
      - name: Build the notices stage
        run: docker build --file gateway-rust/Dockerfile --target notices --tag access-gate-gateway:notices .

      - name: The notices cover the linked crates
        run: |
          docker run --rm --entrypoint cat access-gate-gateway:notices /out/THIRD_PARTY_LICENSES.txt > THIRD_PARTY_LICENSES.txt
          # The file exists and is not empty, and carries the expected licence text and heading.
          test -s THIRD_PARTY_LICENSES.txt
          grep -q 'Apache License' THIRD_PARTY_LICENSES.txt
          grep -q '^Third-party software in the access-gate-gateway image' THIRD_PARTY_LICENSES.txt
          # the gateway's own crates and a crate every build links (hyper) are listed
          grep -q 'access-gate-gateway ' THIRD_PARTY_LICENSES.txt
          grep -q ' hyper ' THIRD_PARTY_LICENSES.txt
