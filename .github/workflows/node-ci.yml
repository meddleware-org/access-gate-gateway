name: Node CI

# CI for the Cloudflare Workers gateway implementation (gateway-workers).
# The Rust gateway is covered by rust-ci.yml.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  workers-ci:
    name: Workers gateway (gateway-workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions aligned (npm == crate == tag)
        working-directory: .
        run: bash scripts/check-versions.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Conformance vectors match the published protocol package
        working-directory: .
        run: node scripts/sync-vectors.mjs --check

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Both projects: unit (Node) and cloudflare-integration (workerd: router, state, body cap).
      - name: Test
        run: npm run test:all
