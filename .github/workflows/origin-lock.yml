name: Origin lock

# Scheduled NEGATIVE check of the relay origin lock (gateway-workers audit F32 / CF-M2). The relay
# origin must be reachable only with the Worker's Cloudflare Access service token. Deploy Workers
# proves the positive case (the token is accepted); this workflow proves the negative: direct requests
# without the token, and with an unknown one, must be refused by Access.
#
# Read-only and secret-free: it sends GET requests to the origin hostname held in the repository
# VARIABLE `UPSTREAM_CHECK_URL` (a public URL, not a secret) and sends no credential. A failed run
# means the origin answered, or was refused by something other than Access, or could not be reached:
# check the Access application ("Walrus relay origin (access-gate Worker only)") in Cloudflare Zero Trust
# first (docs/networking/CLOUDFLARE.md section 2.4 in the workspace repository).
#
# GitHub disables scheduled workflows after 60 days without repository activity; a manual run
# (workflow_dispatch) re-enables the schedule.

on:
  # Once a day, early in the morning UTC.
  schedule:
    - cron: '17 5 * * *'
  # A manual run also re-enables the schedule if GitHub has disabled it.
  workflow_dispatch:
  # Only a change to this check itself triggers it on a pull request.
  pull_request:
    paths:
      - '.github/workflows/origin-lock.yml'
      - 'scripts/check-origin-locked.sh'
      - 'ci/**'

# Privacy by default: no tool in this workflow reports usage to its vendor (Wrangler metrics, the DO_NOT_TRACK convention).
env:
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"

permissions:
  # Read-only, and the check sends no secret.
  contents: read

concurrency:
  group: origin-lock
  # A newer run replaces an older one.
  cancel-in-progress: true

jobs:
  origin-lock:
    name: Origin refuses direct requests
    runs-on: ubuntu-latest
    # The check is three requests; five minutes is generous.
    timeout-minutes: 5
    steps:
      # Check out the commit this run was triggered for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needed to build the classifier the script calls.
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # Cache the Cargo build output between runs; this workflow only reads the cache, so a manual run cannot overwrite it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: origin-lock
          save-if: false

      # curl makes the requests; the verdict is the Rust helper's (access-gate-gateway-ci classify-origin), the same
      # logic the TypeScript script had, with the same cases tested (ci/src/lib.rs).
      - name: Direct requests without the service token are refused by Access
        env:
          UPSTREAM_CHECK_URL: ${{ vars.UPSTREAM_CHECK_URL }}
        run: bash scripts/check-origin-locked.sh
