name: Publish (npm)

# Publishes the Workers gateway source (@meddleware/nft-gate-gateway) to npmjs on
# a v* tag, gated on a self-contained verify job against the exact tagged commit.
# Uses npm OIDC trusted publishing — no long-lived NPM_TOKEN. Opt-in via the repository
# variable NPM_PUBLISH=true (matches the other @meddleware publish workflows).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify (gateway-workers type-check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions aligned (npm == crate == tag)
        working-directory: .
        run: bash scripts/check-versions.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Conformance vectors match the published protocol package
        working-directory: .
        run: node scripts/sync-vectors.mjs --check
      - name: Type-check
        run: npm run type-check --if-present
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:all

  # ── Workers gateway: npmjs (source-distribution for forkers) ───────────────
  # Uses OIDC trusted publisher — no static NPM_TOKEN secret required. The npmjs.com
  # Trusted Publisher for @meddleware/nft-gate-gateway must name this repo
  # (meddleware-org/nft-gate) and this workflow file (npm-publish.yml).
  # A failed publish fails the job (and the run) — no continue-on-error — so a red run
  # is the signal that the npm release did not happen. An already-published version is
  # still treated as success (idempotent re-runs / manual publishes).
  publish-npm:
    name: npmjs (@meddleware/nft-gate-gateway)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publisher exchange
    defaults:
      run:
        working-directory: gateway-workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 ships an older npm, which
      # skips the OIDC token exchange and gets an unauthenticated E404 on publish. Pinned (not
      # @latest) so a compromised or broken npm release cannot reach the publish step.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.20.0

      # No tag == version check: this repository publishes the npm package and the crate from
      # the same v* tag at different versions (idempotent: an already-published version is skipped).
      - name: Install dependencies
        run: npm ci

      - name: Publish to npmjs (provenance via OIDC, idempotent, opt-in)
        env:
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          if [ "${NPM_PUBLISH}" != "true" ]; then
            echo "::warning::npm publishing not configured — set repository variable NPM_PUBLISH=true and configure an npmjs trusted publisher to enable it. Skipping npm publication."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          ENC=$(printf '%s' "$NAME" | sed 's#/#%2f#')
          # Check the registry directly — `npm view` can transiently miss a freshly
          # first-published version and then attempt a re-publish. A 200 means it's live.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${ENC}/${VERSION}")" = "200" ]; then
            echo "::notice::v${VERSION} already published to npmjs — skipping."
          else
            # Publish, but treat a "version already exists" error as success so a
            # manually-published version (or a registry race) leaves the job green.
            set +e; OUT=$(npm publish --provenance 2>&1); RC=$?; set -e
            printf '%s\n' "$OUT"
            if [ "$RC" -ne 0 ]; then
              if printf '%s' "$OUT" | grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT'; then
                echo "::notice::v${VERSION} already published — treating as success."
              else
                exit "$RC"
              fi
            fi
          fi
