# Publishes the Rust crates to crates.io on a v* tag, gated on the full Rust CI against the exact
# tagged commit: `access-gate-gateway-core` first (the shared decision logic), then `access-gate-gateway`, which
# depends on it at the same version (one version for everything, D16). Uses crates.io trusted
# publishing (OIDC): no long-lived token. The crates.io trusted publisher of EACH crate
# (access-gate-gateway-core, access-gate-gateway) must name this repository and this workflow file.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/rust-ci.yml

  publish-crates:
    name: crates.io (access-gate-gateway-core, access-gate-gateway)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write # OIDC exchange for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # The reusable verify workflow (rust-ci.yml) checks npm == crate == tag (D16). The version lives
      # once, in the workspace manifest.
      - name: Read the workspace version
        id: version
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check what is already published
        id: check
        run: |
          for crate in access-gate-gateway-core access-gate-gateway; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: github-actions/access-gate-gateway" \
              "https://crates.io/api/v1/crates/$crate/${{ steps.version.outputs.version }}")
            key=$(echo "$crate" | tr - _)
            if [ "$HTTP" = "200" ]; then
              echo "${key}_skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$crate ${{ steps.version.outputs.version }} already on crates.io — skipping"
            else
              echo "${key}_skip=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Obtain a crates.io token (trusted publishing)
        if: steps.check.outputs.access_gate_gateway_core_skip == 'false' || steps.check.outputs.access_gate_gateway_skip == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # The core first: the gateway's published manifest depends on it by exact version, and `cargo
      # publish` waits until the new crate is visible in the index before returning.
      - name: Publish access-gate-gateway-core
        if: steps.check.outputs.access_gate_gateway_core_skip == 'false'
        run: cargo publish --locked -p access-gate-gateway-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish access-gate-gateway
        if: steps.check.outputs.access_gate_gateway_skip == 'false'
        run: cargo publish --locked -p access-gate-gateway
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
