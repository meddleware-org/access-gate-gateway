# Licences accepted for crates linked into the gateway binary. A dependency under any other licence fails
# the image build and CI (`cargo about generate --fail`): review it, then add it here deliberately (and
# to ../deny.toml).
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
# The platforms the image is built for, so only the crates linked there are counted.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Build-time and test-only dependencies are not in the shipped binary, so they are not listed in the notices.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# `ring` has a custom licence text that cargo-about needs a built-in workaround for.
workarounds = ["ring"]
