# EXPERIMENT (feasibility spike for a Rust/wasm Cloudflare Worker). Not part of any release.
# See README.md and FINDINGS.md. Versions are pinned exactly.
[workspace]
members = ["core", "worker"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "0BSD"

[profile.release]
# Same posture as gateway-rust (overflow-checks, abort on panic, fat LTO) plus size tuning for wasm.
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
