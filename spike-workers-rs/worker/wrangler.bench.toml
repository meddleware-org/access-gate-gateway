# Spike config: NOT deployed. Runs under `wrangler dev` / workerd and `wrangler deploy --dry-run`.
name = "nft-gate-spike-workers-rs-bench"
main = "build-bench/index.js"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release -d build-bench --features bench"

[vars]
SUI_RPC_URL = "https://fullnode.testnet.sui.io:443"
UPSTREAM_URL = "http://127.0.0.1:18080"
MAX_BODY_BYTES = "100000000"
GATEWAY_ORIGIN = "https://gateway.example"
GATE_ID = "0xa1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1"
NETWORK = "testnet"
NFT_TYPE = "0xabc::access_gate::SoulboundAccessNFT"
SINGLE_USE = "true"
# Deterministic clock for scripts/differential.mjs (never set in a real deployment).
TEST_CLOCK = "1"

[[durable_objects.bindings]]
name = "NONCE_STATE"
class_name = "NonceRateState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NonceRateState"]
