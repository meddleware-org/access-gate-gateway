[package]
name = "nft-gate-spike-worker"
description = "Spike: nft-gate on Cloudflare Workers in Rust (workers-rs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Embeds conformance/vectors.json so /bench can verify real signatures without a request body.
# Off for the size measurement of the "production-shaped" build.
bench = []

[dependencies]
nft-gate-core = { path = "../core" }
worker = { version = "=0.8.7", features = ["http"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["ReadableStream", "WritableStream", "TransformStream", "TransformStreamDefaultController", "ReadableWritablePair", "Performance", "WorkerGlobalScope", "AbortController", "AbortSignal", "Request", "RequestInit", "RequestRedirect", "Response", "ResponseInit", "Headers", "AbortSignal", "Url", "UrlSearchParams"] }
getrandom = { version = "=0.2.17", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
anyhow = "=1.0.104"
console_error_panic_hook = "=0.1.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
