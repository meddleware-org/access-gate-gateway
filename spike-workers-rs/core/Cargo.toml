[package]
name = "nft-gate-core"
description = "Pure decision logic shared by the native (axum) and Cloudflare Worker (wasm32) nft-gate gateways. No hyper, no tokio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
hex = "=0.4.3"
blake2 = "=0.11.0"
ed25519-consensus = "=2.1.0"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
serde_json = "=1.0.154"

[dev-dependencies]
proptest = "=1.12.0"
pollster = "=0.4.0"

# rand_core 0.6 (pulled in by ed25519-consensus / elliptic-curve) enables getrandom 0.2, which has no
# backend on wasm32-unknown-unknown unless "js" is set. Never called on the verify path.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }
