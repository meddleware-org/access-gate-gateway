# access-gate-gateway — Cloudflare Workers deployment.
#
# Wire-identical to the Rust gateway (../gateway-rust). Bind it to the SAME public hostname the
# Rust gateway serves (see [routes] below) to switch implementations with nothing else changing.
#
# OPERATOR SETUP — run these once before deploying, then never touch them again:
#
#   UPSTREAM_URL (required — your CF-Access-locked relay/upstream origin):
#     wrangler secret put UPSTREAM_URL
#     Value: the full origin URL (e.g. https://your-origin.example.com)
#     This is kept as a secret so it does not appear in this public file and is
#     not overwritten by `wrangler deploy`.
#
#   UPSTREAM_AUTH_HEADERS (required for CF-Access-locked origin):
#     wrangler secret put UPSTREAM_AUTH_HEADERS
#     Value (JSON): [{"name":"CF-Access-Client-Id","value":"<id>"},{"name":"CF-Access-Client-Secret","value":"<secret>"}]
#     Obtain from: Cloudflare Zero Trust → Access → Service Tokens → create token
#     The Access policy on your origin hostname must allow this token.
#
#   SUI_RPC_AUTH_HEADER (optional — only if using an authenticated/private RPC):
#     wrangler secret put SUI_RPC_AUTH_HEADER
#     Value: "Authorization: Bearer <token>"
#
#   CF_ANALYTICS_TOKEN (optional — only if QUOTA_GUARD_ENABLED=true):
#     wrangler secret put CF_ANALYTICS_TOKEN
#   CF_ACCOUNT_ID (optional — only if QUOTA_GUARD_ENABLED=true):
#     wrangler secret put CF_ACCOUNT_ID

name = "access-gate-gateway"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
# Serve only on the route below: no *.workers.dev or preview URL that would bypass the hostname-level
# edge rules (WAF, rate limits) on the zone.
workers_dev = false
preview_urls = false

# ── config (parity with the Rust gateway env; see README.md for the mapping) ─────────────────
[vars]
# UPSTREAM_URL is set via `wrangler secret put` (see above) so the private origin never appears in
# this public file. Do not add it here.

# Public fullnode — safe to keep as a plain var (no sensitive information).
SUI_RPC_URL = "https://fullnode.testnet.sui.io:443"
NETWORK = "testnet"
# The public origin of THIS gateway, signed into every access proof (access-gate-gateway:access:v3): a proof made
# for another gateway, gate or network is useless here. Must equal the route's hostname below.
GATEWAY_ORIGIN = "https://sui-walrus-storage-relay-testnet.meddleware.co.uk"

# Required: the pass type this gateway accepts, `<access_gate original id>::access_gate::AccessNFT`
# or `…::SoulboundAccessNFT`. A public on-chain type, so a plain var (it was a secret until 0.0.14).
NFT_TYPE = "0xd7ddaa94b74330979b2b618fc81206d160a264f1c9ca148a77fa2144301388c9::access_gate::SoulboundAccessNFT"
# Required: the gate whose passes are accepted — the testnet Walrus relay gate on access_gate
# 0xd7ddaa94… (2026-10-09). Change GATE_ID and NFT_TYPE only together with the apps' VITE_ACCESS_GATE_ID_TESTNET
# (walrus-storage-ui, dashboard, token-issuance-ui) — never one without the others.
GATE_ID = "0x316f1bf9764db352e925bb598aff44ea77be4ab652f0bd2eb3fdcc0a378faddc"
SINGLE_USE = "true"
PUBLIC_PATHS = "/v1/tip-config"
RATE_LIMIT_PER_MIN = "30"
# Per-client-IP budget for GET /v1/challenge (issuing a nonce writes Durable Object state).
CHALLENGE_RATE_LIMIT_PER_MIN = "30"
# Unauthenticated public paths (/v1/tip-config) are protected separately: a higher per-client-IP
# request ceiling (cheap GETs) plus an edge cache so floods are absorbed before reaching the relay.
PUBLIC_RATE_LIMIT_PER_MIN = "120"
PUBLIC_CACHE_TTL_SECS = "60"
# 10^8 B: the zone's request-body limit on the Cloudflare Free and Pro plans is "100 MB" (decimal), set by
# the zone plan, not the Workers plan. Matching it exactly means a too-large upload gets the gateway's own
# JSON 413 (with CORS) instead of the platform's. See README "Request body limit".
MAX_BODY_BYTES = "100000000"
# Total deadline for one upstream exchange (body in, response out). The redemption lease below must
# outlive it (checked at startup), so a lease cannot lapse mid-upload.
UPSTREAM_TIMEOUT_SECS = "600"
RPC_TIMEOUT_SECS = "15"
# Per-client-IP budget for gated requests, checked before signature verification.
GATED_PREAUTH_RATE_LIMIT_PER_MIN = "120"
CHALLENGE_TTL_SECS = "300"
OWNERSHIP_CACHE_TTL_MS = "0"
# Single-use redemption: the permanent on-chain consumeDigest is the one-time token. A use is only
# spent when an upload actually succeeds (commit); an interrupted upload releases the lease so the
# consume stays redeemable (the use is never lost). LEASE_TTL bounds an in-flight upload and must
# exceed UPSTREAM_TIMEOUT_SECS; RETENTION is how long a spent consume is remembered. A consume older
# than CONSUME_MAX_AGE_SECS is refused, so no consume can outlive its redemption record (5 days is
# inside the ~5.5-day transaction retention of public testnet fullnodes).
REDEMPTION_LEASE_TTL_SECS = "900"
REDEMPTION_RETENTION_SECS = "2592000"
CONSUME_MAX_AGE_SECS = "432000"
# Workers-specific:
NONCE_BACKEND = "durable-object" # "durable-object" (default) | "kv"
NONCE_SHARD = "region"           # "region" (default) | "global"
NONCE_MAX_ENTRIES = "1000000"
QUOTA_GUARD_ENABLED = "false"
# The account's Workers plan: "free" (launch) | "paid". Selects the quota guard's allowances (Free daily
# limits vs Paid monthly included amounts). Change it in the same deploy as the plan switch
# (README "Switch to Workers Paid").
WORKERS_PLAN = "free"
# Comma-separated list of browser origins allowed to make cross-origin requests.
# Only these origins receive Access-Control-Allow-Origin in responses.
ALLOWED_ORIGINS = "https://sui-walrus-storage.meddleware.co.uk,https://dash.meddleware.co.uk,https://sui-token-issuance.meddleware.co.uk"

# ── CPU ceiling (Workers Paid only; denial-of-wallet guard) ────────────────────────────────────
# On Workers Free every request is capped at 10 ms CPU by the platform and this block must stay
# commented out. On Workers Paid the default cap is 30 s per request and CPU beyond the 30M ms included
# a month is billed, so a pathological input could run up a bill. A gated request is one signature
# verification plus JSON/stream handling (test/cpu-bench*.test.ts: ~1–2 ms per warm verification in
# local workerd, up to ~36 ms for the first one in a fresh isolate); 50 ms covers both and is far below
# the default. Uncomment when switching to Paid (README "Switch to
# Workers Paid"), after reading the CPU-time p99 in Workers analytics.
# [limits]
# cpu_ms = 50

# ── nonce store + rate limiter: region-sharded, SQLite-backed Durable Objects (free-tier) ────
[[durable_objects.bindings]]
name = "NONCE_STATE"
class_name = "NonceRateState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NonceRateState"]

# ── KV backend (only needed when NONCE_BACKEND=kv) ────────────────────────────────────────────
# [[kv_namespaces]]
# binding = "NONCE_KV"
# id = "<KV_NAMESPACE_ID>"   # create with: wrangler kv namespace create NONCE_KV

# ── route: Worker serves as the public NFT-gated relay endpoint ───────────────────────────────
# Configured via CF API (route ID 63427e4dbf9b4428ad9c492487953551).
# wrangler deploy will create/update this automatically.
[[routes]]
pattern = "sui-walrus-storage-relay-testnet.meddleware.co.uk/*"
zone_name = "meddleware.co.uk"

# ── optional quota guard (needs QUOTA_GUARD_ENABLED=true + the secrets above) ────────────────
# [triggers]
# crons = ["*/15 * * * *"]
