# The CI helper binary: the deploy-time and scheduled checks the workflows call (validate the Worker's upstream
# credentials, classify an origin-lock probe). It is a workspace member so it shares the core's parser; it is not published.
[package]
# The name is the binary the workflows run.
name = "access-gate-gateway-ci"
description = "CI helpers for the access-gate-gateway deploy workflows: validate UPSTREAM_AUTH_HEADERS with the core's parser, and classify origin-lock probe responses. Not published."
# One version, edition, minimum Rust, licence and repository for every crate, from the workspace manifest.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published: it exists for the repository's own workflows.
publish = false

# The binary and where its entry point is.
[[bin]]
name = "access-gate-gateway-ci"
path = "src/main.rs"

[dependencies]
# The core, at exactly this workspace's version, so the CI check and the Worker use the same parser.
access-gate-gateway-core = { version = "=0.0.34", path = "../core" }
# Errors with context for the command line.
anyhow = "1"

# The workspace lint levels (including the documentation lints).
[lints]
workspace = true
