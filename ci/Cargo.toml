[package]
name = "access-gate-gateway-ci"
description = "CI helpers for the access-gate-gateway deploy workflows: validate UPSTREAM_AUTH_HEADERS with the core's parser, and classify origin-lock probe responses. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "access-gate-gateway-ci"
path = "src/main.rs"

[dependencies]
access-gate-gateway-core = { version = "=0.0.33", path = "../core" }
anyhow = "1"
