# cargo-deny policy for nft-gate-gateway (run in CI by rust-ci.yml; locally: `cargo deny check`).

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# RustSec advisories: vulnerable and yanked crates fail the build; unmaintained crates are reported
# for the whole graph so a replacement can be planned.
yanked = "deny"
unmaintained = "all"

[licenses]
# Permissive licences present in the dependency tree (2026-09-30). Adding a crate under any other
# licence fails CI until it is reviewed and listed here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in the async ecosystem; report them without failing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no git dependencies or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
